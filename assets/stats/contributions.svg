<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" preserveAspectRatio="xMidYMid meet" data-state="pending" role="img" aria-labelledby="contrib-card-title contrib-card-desc"><title id="contrib-card-title">Contributions</title><desc id="contrib-card-desc">Contributions card pending the first generation with real data.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect x="0" y="0" width="480" height="360" fill="#090b12"/><rect x="0.5" y="0.5" width="479" height="359" fill="none" stroke="#49405c" stroke-width="1" rx="16"/><text x="27" y="40" font-size="27" fill="#eceef7" font-weight="bold">Contributions</text><path d="M27 64H453" stroke="#49405c" stroke-width="1" fill="none"/><text x="27" y="124" font-size="17" fill="#bdc3d3">This card is pending: it holds no real data yet.</text><text x="27" y="150" font-size="17" fill="#bdc3d3">It is generated automatically by the next</text><text x="27" y="176" font-size="17" fill="#bdc3d3">workflow run with a valid token.</text><rect x="27" y="210" width="426" height="120" fill="none" stroke="#49405c" stroke-width="1" rx="10" stroke-dasharray="6 6"/></svg>